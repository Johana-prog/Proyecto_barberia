<!-- Barra superior y fondo del cajón: solo se ven en celular y tablet (ver panel.css) -->
<div class="m-topbar">
    <button type="button" class="m-menu-btn" id="mMenuBtn" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="17" y2="17"/></svg>
    </button>
    <span class="m-topbar-titulo">USME BARBER TOP</span>
</div>
<div class="m-backdrop" id="mBackdrop" aria-hidden="true"></div>

<script>
    (function () {
        var sidebar = document.getElementById('sidebar');
        var boton = document.getElementById('mMenuBtn');
        var fondo = document.getElementById('mBackdrop');
        if (!sidebar || !boton) { return; }

        function sincronizar() {
            var abierto = sidebar.classList.contains('abierto');
            boton.setAttribute('aria-expanded', abierto ? 'true' : 'false');
            boton.setAttribute('aria-label', abierto ? 'Cerrar menú' : 'Abrir menú');
        }

        function cerrar() {
            sidebar.classList.remove('abierto');
            sincronizar();
        }

        boton.addEventListener('click', function (e) {
            e.stopPropagation();
            sidebar.classList.toggle('abierto');
            sincronizar();
        });

        // Al tocar una opción se cierra el cajón (sirve cuando solo cambia de pestaña)
        sidebar.addEventListener('click', function (e) {
            if (e.target.closest('.nav-item')) { cerrar(); }
        });

        fondo.addEventListener('click', cerrar);

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape' && sidebar.classList.contains('abierto')) {
                cerrar();
                boton.focus();
            }
        });
    })();
</script>
