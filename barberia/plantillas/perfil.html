{% extends 'base.html' %}

{% block contenido %}
<div style="display: flex; width: 100%; min-height: calc(100vh - 60px);">

    {% include 'menu_lateral.html' %}

    <div style="flex: 1; padding: 40px; display: flex; justify-content: center;">
        <div style="width: 100%; max-width: 500px;">
            <h2 style="color: #fff; margin-bottom: 5px; font-size: 1.6rem;">⚙️ Editar Mi Perfil</h2>
            <p style="color: #888; margin-bottom: 25px; font-size: 0.9rem;">Actualiza tus datos personales y tu foto.</p>

            {% if mensaje %}
                <div style="background-color: rgba(46, 204, 113, 0.15); color: #2ecc71; padding: 12px; border-radius: 6px; margin-bottom: 20px; font-weight: bold; text-align: center;">{{ mensaje }}</div>
            {% endif %}

            <div style="background-color: #1a1a1a; padding: 30px; border-radius: 10px; border-top: 3px solid rgb(201, 39, 39);">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- 📸 Foto actual + botón para cambiarla -->
                    <div style="text-align: center; margin-bottom: 25px;">
                        {% if usuario.foto %}
                            <img src="{{ usuario.foto.url }}" style="width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid rgb(201, 39, 39); margin-bottom: 12px;">
                        {% else %}
                            <div style="width: 110px; height: 110px; border-radius: 50%; background-color: #222; display: flex; align-items: center; justify-content: center; font-size: 2.8rem; margin: 0 auto 12px auto;">👤</div>
                        {% endif %}
                        <label style="display: inline-block; background-color: #fff; color: #111; padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; cursor: pointer;">
                            📷 Cambiar foto
                            <input type="file" name="foto" accept="image/*" style="display: none;">
                        </label>
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label style="display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 4px;">Nombre:</label>
                        <input type="text" name="nombre" value="{{ usuario.nombre }}" required style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 6px;">
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label style="display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 4px;">Apellido:</label>
                        <input type="text" name="apellido" value="{{ usuario.apellido }}" required style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 6px;">
                    </div>

                    <div style="margin-bottom: 14px;">
                        <label style="display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 4px;">Teléfono:</label>
                        <input type="text" name="telefono" value="{{ usuario.telefono }}" style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 6px;">
                    </div>

                    <div style="margin-bottom: 22px;">
                        <label style="display: block; color: #aaa; font-size: 0.85rem; margin-bottom: 4px;">Correo:</label>
                        <input type="email" name="correo" value="{{ usuario.correo }}" required style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 6px;">
                    </div>

                    <button type="submit" style="width: 100%; background-color: rgb(201, 39, 39); color: white; border: none; padding: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 0.95rem;">
                        GUARDAR CAMBIOS ✅
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
