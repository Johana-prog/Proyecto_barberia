{% extends 'base.html' %}

{% block contenido %}
<div style="max-width: 400px; margin: 60px auto; background-color: #1a1a1a; padding: 30px; border-radius: 8px; border-top: 4px solid rgb(201, 39, 39); box-shadow: 0 8px 24px rgba(201, 39, 39, 0.2);">
    
    <h2 style="color: rgb(201, 39, 39); text-align: center; margin-bottom: 20px; font-size: 1.8rem;">👤 BIENVENID@ </h2> <h4>Inicia sesión para acceder a tu panel</h4>  <br>
    
    <!-- Alerta roja de error por si se equivocan en los datos -->
    {% if error %}
        <div style="background-color: rgba(231, 76, 60, 0.2); color: #e74c3c; padding: 10px; border-radius: 4px; text-align: center; margin-bottom: 15px; font-size: 0.9rem; border: 1px solid #e74c3c;">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        {% csrf_token %}

        <div>
            <label style="display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9rem;">Correo Electrónico:</label>
            <input type="email" name="correo" required style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 4px;">
        </div>

        <div>
            <label style="display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9rem;">Contraseña:</label>
            <input type="password" name="contraseña" required style="width: 100%; padding: 10px; background-color: #111; border: 1px solid #333; color: white; border-radius: 4px;">
        </div>

        <!-- Botón Principal: Entrar al sistema -->
        <button type="submit" style="background-color: rgb(201, 39, 39); color: white; border: none; padding: 12px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px; transition: 0.3s; width: 100%;">
           ⇨ Ingresar
        </button>

        <hr style="border: 0; height: 1px; background: #333; margin: 15px 0;">

        <!-- 🎯 EL NUEVO ENLACE: Para mandar al usuario a registrarse si es nuevo -->
        <div style="text-align: center;">
            <p style="color: #888; font-size: 0.9rem; margin-bottom: 8px;">¿Eres nuevo en Usme Barber Top?</p>
            <a href="/registro/" style="color: rgb(201, 39, 39); font-weight: bold; text-decoration: none; font-size: 0.95rem; transition: 0.3s;">
                👉 CREA UNA CUENTA AQUÍ ✂️
            </a>
        </div>
    </form>
</div>
{% endblock %}
