{% extends 'auth_base.html' %}

{% block formulario %}
    <h1 class="auth-titulo">Iniciar sesión</h1>
    <p class="auth-sub">Ingresa con tu correo y tu contraseña</p>

    {% if error %}
        <div class="alerta alerta-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="campo">
            <label for="correo">Correo</label>
            <div class="campo-icono">
                <svg class="ico"><use href="#i-mail"/></svg>
                <input type="email" id="correo" name="correo" class="input" placeholder="tucorreo@ejemplo.com" required autofocus>
            </div>
        </div>

        <div class="campo" style="margin-bottom: 24px;">
            <label for="clave">Contraseña</label>
            <div class="campo-icono">
                <svg class="ico"><use href="#i-lock"/></svg>
                <input type="password" id="clave" name="contraseña" class="input" placeholder="Tu contraseña" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primario btn-block">
            <svg class="ico"><use href="#i-scissors"/></svg>Entrar
        </button>
    </form>

    <div class="auth-pie">
        ¿No tienes cuenta? <a href="/registro/" class="auth-link">Regístrate</a><br>
        <a href="/inicio/" class="auth-volver">← Volver al inicio</a>
    </div>
{% endblock %}
