{% extends 'base.html' %}
{% load static %}

{% block contenido %}
<style>
    .auth-fondo {
        position: relative;
        min-height: 82vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        overflow: hidden;
        background: #000;
    }

    .auth-fondo .carrusel-slide {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
    }

    .auth-fondo .carrusel-slide.activo { opacity: 1; }

    .auth-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: linear-gradient(180deg, rgba(20, 18, 17, 0.72) 0%, rgba(20, 18, 17, 0.9) 100%);
    }

    .auth-fondo .cortina-navaja {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -20%;
        width: 20%;
        z-index: 2;
        background: var(--dorado);
        box-shadow: 0 0 25px 5px rgba(201, 162, 39, 0.6);
    }

    .auth-fondo .cortina-navaja.deslizando { animation: authNavaja 0.9s ease-in-out; }

    @keyframes authNavaja {
        0%   { left: -20%; }
        50%  { left: 40%; }
        100% { left: 120%; }
    }

    .auth-card {
        position: relative;
        z-index: 4;
        width: 100%;
        max-width: 440px;
        padding: 34px 32px;
        background: rgba(29, 26, 24, 0.94);
        backdrop-filter: blur(6px);
        border: 1px solid var(--borde);
        border-top: 3px solid var(--dorado);
        border-radius: 14px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .auth-marca {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 22px;
    }

    .auth-marca-icono {
        width: 42px;
        height: 42px;
        display: grid;
        place-items: center;
        border-radius: var(--radio);
        color: var(--dorado);
        background: var(--dorado-suave);
        border: 1px solid rgba(201, 162, 39, 0.45);
    }

    .auth-marca-icono .ico { width: 22px; height: 22px; }

    .auth-marca-texto {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 1.5rem;
        letter-spacing: 1.5px;
        color: var(--hueso);
    }

    .auth-titulo {
        text-align: center;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--hueso);
    }

    .auth-sub {
        text-align: center;
        color: var(--piedra);
        font-size: 0.85rem;
        margin: 4px 0 24px;
    }

    .auth-nota {
        text-align: center;
        color: var(--piedra);
        font-size: 0.78rem;
        margin: -12px 0 20px;
    }

    .alerta-error {
        background: rgba(140, 42, 42, 0.18);
        border-color: rgba(163, 51, 51, 0.55);
        color: #E3A0A0;
    }

    .campo-icono { position: relative; }

    .campo-icono .ico {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        color: var(--piedra);
        pointer-events: none;
    }

    .campo-icono .input { padding-left: 42px; }

    .auth-fila-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .auth-pie {
        margin-top: 22px;
        text-align: center;
        color: var(--piedra);
        font-size: 0.85rem;
        line-height: 1.9;
    }

    .auth-link { color: var(--dorado); font-weight: 700; }
    .auth-link:hover { color: #E0BC45 !important; }

    .auth-volver { color: var(--piedra); font-size: 0.8rem; }
    .auth-volver:hover { color: var(--hueso) !important; }

    @media (max-width: 480px) {
        .auth-card { padding: 28px 22px; }
        .auth-fila-2 { grid-template-columns: 1fr; }
    }
</style>

<!-- Íconos usados en estas pantallas -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-scissors" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><path d="M8.12 8.12 12 12"/><path d="M20 4 8.12 15.88"/><circle cx="6" cy="18" r="3"/><path d="M14.8 14.8 20 20"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
    <symbol id="i-id" viewBox="0 0 24 24"><path d="M16 2v2"/><path d="M7 22v-2a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M8 2v2"/><circle cx="12" cy="11" r="3"/><rect x="3" y="4" width="18" height="18" rx="2"/></symbol>
</svg>

<div class="auth-fondo">
    <div class="carrusel-slide activo" style="background-image: url('{% static 'imagenes/carrusel1.png' %}');"></div>
    <div class="carrusel-slide" style="background-image: url('{% static 'imagenes/carrusel2.png' %}');"></div>
    <div class="carrusel-slide" style="background-image: url('{% static 'imagenes/carrusel3.png' %}');"></div>
    <div class="carrusel-slide" style="background-image: url('{% static 'imagenes/carrusel4.png' %}');"></div>
    <div class="carrusel-slide" style="background-image: url('{% static 'imagenes/carrusel5.png' %}');"></div>

    <div class="auth-overlay"></div>
    <div class="cortina-navaja" id="cortinaNavaja"></div>

    <div class="auth-card">
        <div class="auth-marca">
            <span class="auth-marca-icono"><svg class="ico"><use href="#i-scissors"/></svg></span>
            <span class="auth-marca-texto">USME BARBER TOP</span>
        </div>

        {% block formulario %}{% endblock %}
    </div>
</div>

<script>
    (function () {
        var slides = document.querySelectorAll('.auth-fondo .carrusel-slide');
        var cortina = document.getElementById('cortinaNavaja');
        if (!slides.length || !cortina) { return; }
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { return; }

        var actual = 0;
        setInterval(function () {
            cortina.classList.add('deslizando');
            setTimeout(function () {
                slides[actual].classList.remove('activo');
                actual = (actual + 1) % slides.length;
                slides[actual].classList.add('activo');
            }, 400);
            setTimeout(function () { cortina.classList.remove('deslizando'); }, 900);
        }, 4000);
    })();
</script>
{% endblock %}
